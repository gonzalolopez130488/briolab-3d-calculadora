name: Compilar APK BrioLab 3D

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto APK
        run: |
          mkdir apk_project
          unzip -q BrioLab3D_APK_proyecto_v2.zip -d apk_project
          echo "Proyecto descomprimido:"
          find apk_project -name settings.gradle -o -name build.gradle

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: apk_project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BrioLab3D-APK
          path: apk_project/**/app/build/outputs/apk/debug/app-debug.apk
